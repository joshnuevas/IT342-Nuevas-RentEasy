spring:
  application:
    name: renteasy

  devtools:
    restart:
      enabled: false

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

paymongo:
  secret-key: ${PAYMONGO_SECRET_KEY:}
  payment-methods: ${PAYMONGO_PAYMENT_METHODS:card,gcash}

server:
  port: 8080
